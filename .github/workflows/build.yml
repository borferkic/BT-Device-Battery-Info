name: Compilación

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore ".\BT Device Battery Info.slnx"

      - name: Verificar formato
        run: dotnet format ".\BT Device Battery Info.slnx" --verify-no-changes --no-restore

      - name: Compilar Release
        run: dotnet build ".\BT Device Battery Info.slnx" --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test ".\BT Device Battery Info.slnx" --configuration Release --no-restore
